name: Infra Monitoring (Daily Report)

# 매일 1회 staging/production EC2 인프라 상태(CPU, 메모리, 디스크, Postgres, PM2, nginx, SSL 인증서, 헬스체크)를
# 점검해서 디스코드로 요약 리포트를 보냅니다. 배포 트리거가 아니라 순수 모니터링용입니다.
#
# 임계치는 사내 "Backend 업그레이드/모니터링" 문서 기준(CPU 80%, 메모리 80~90%, 디스크 80%)을 따릅니다.
# CPU는 GitHub Actions cron이 하루 한 번 도는 구조라 진짜 "지속" 여부는 못 보고, 실행 시점의
# 1분 load average를 vCPU 수로 나눈 스냅샷 근사치입니다 — 참고용이며 사이렌은 아닙니다.

on:
  schedule:
    - cron: "0 0 * * *" # 매일 00:00 UTC = 09:00 KST
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH keys
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "${{ secrets.STAGING_EC2_SSH_KEY }}" > ~/.ssh/staging.pem
          printf '%s\n' "${{ secrets.PRODUCTION_EC2_SSH_KEY }}" > ~/.ssh/production.pem
          chmod 600 ~/.ssh/staging.pem ~/.ssh/production.pem

      - name: Gather staging EC2 status
        id: staging
        env:
          HOST: ${{ secrets.STAGING_EC2_HOST }}
        run: |
          OUT=$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/staging.pem "ec2-user@${HOST}" '
            IMDS_TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60" 2>/dev/null)
            INSTANCE_TYPE=$(curl -s -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/instance-type 2>/dev/null)
            UPTIME=$(uptime -p 2>/dev/null)
            VCPUS=$(nproc 2>/dev/null)
            CPU_LOAD1=$(awk "{print \$1}" /proc/loadavg 2>/dev/null)
            DISK_LINE=$(df -h / | tail -1)
            DISK_PCT=$(echo "$DISK_LINE" | awk "{print \$5}" | tr -d "%")
            DISK_HUMAN=$(echo "$DISK_LINE" | awk "{print \$3\"/\"\$2\" (\"\$5\")\"}")
            MEM_HUMAN=$(free -h | awk "/Mem:/{print \$3\"/\"\$2}")
            MEM_PCT=$(free | awk "/Mem:/{printf \"%.0f\", \$3/\$2*100}")
            CERT_FILE="/etc/letsencrypt/live/api-staging.picakes.com/fullchain.pem"
            if sudo test -f "$CERT_FILE"; then
              NOT_AFTER=$(sudo openssl x509 -in "$CERT_FILE" -noout -enddate 2>/dev/null | cut -d= -f2)
              EXP_EPOCH=$(date -d "$NOT_AFTER" +%s 2>/dev/null || echo 0)
              SSL_DAYS=$(( (EXP_EPOCH - $(date +%s)) / 86400 ))
            else
              SSL_DAYS="NA"
            fi
            TIMER_ACTIVE=$(systemctl is-active certbot-renew.timer 2>/dev/null)
            TIMER_ENABLED=$(systemctl is-enabled certbot-renew.timer 2>/dev/null)
            NGINX_ACTIVE=$(systemctl is-active nginx 2>/dev/null)
            PM2_JSON=$(pm2 jlist 2>/dev/null)
            PM2_STATUS=$(echo "$PM2_JSON" | jq -r ".[] | select(.name==\"picake-backend-staging\") | .pm2_env.status" 2>/dev/null)
            PM2_RESTARTS=$(echo "$PM2_JSON" | jq -r ".[] | select(.name==\"picake-backend-staging\") | .pm2_env.restart_time" 2>/dev/null)
            LOCAL_HEALTH=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8080/health 2>/dev/null)
            PG_ACTIVE=$(systemctl is-active postgresql 2>/dev/null)
            PG_CONNECTIONS=$(sudo -u postgres psql -tAc "SELECT count(*) FROM pg_stat_activity;" 2>/dev/null | tr -d "[:space:]")
            PG_STAT_EXT=$(sudo -u postgres psql -d picake_staging_db -tAc "SELECT 1 FROM pg_extension WHERE extname='"'"'pg_stat_statements'"'"';" 2>/dev/null | tr -d "[:space:]")
            echo "INSTANCE_TYPE=${INSTANCE_TYPE:-unknown}"
            echo "UPTIME=${UPTIME:-unknown}"
            echo "VCPUS=${VCPUS:-NA}"
            echo "CPU_LOAD1=${CPU_LOAD1:-NA}"
            echo "DISK_PCT=${DISK_PCT:-NA}"
            echo "DISK_HUMAN=${DISK_HUMAN:-NA}"
            echo "MEM_HUMAN=${MEM_HUMAN:-NA}"
            echo "MEM_PCT=${MEM_PCT:-NA}"
            echo "SSL_DAYS=${SSL_DAYS:-NA}"
            echo "TIMER_ACTIVE=${TIMER_ACTIVE:-unknown}"
            echo "TIMER_ENABLED=${TIMER_ENABLED:-unknown}"
            echo "NGINX_ACTIVE=${NGINX_ACTIVE:-unknown}"
            echo "PM2_STATUS=${PM2_STATUS:-unknown}"
            echo "PM2_RESTARTS=${PM2_RESTARTS:-NA}"
            echo "LOCAL_HEALTH=${LOCAL_HEALTH:-000}"
            echo "PG_ACTIVE=${PG_ACTIVE:-unknown}"
            echo "PG_CONNECTIONS=${PG_CONNECTIONS:-NA}"
            echo "PG_STAT_EXT=${PG_STAT_EXT:-0}"
          ' 2>&1) || true
          echo "$OUT"
          echo "$OUT" | grep -E '^[A-Z0-9_]+=' >> "$GITHUB_OUTPUT"

      - name: Gather production EC2 status
        id: production
        env:
          HOST: ${{ secrets.PRODUCTION_EC2_HOST }}
        run: |
          OUT=$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/production.pem "ec2-user@${HOST}" '
            IMDS_TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60" 2>/dev/null)
            INSTANCE_TYPE=$(curl -s -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/instance-type 2>/dev/null)
            UPTIME=$(uptime -p 2>/dev/null)
            VCPUS=$(nproc 2>/dev/null)
            CPU_LOAD1=$(awk "{print \$1}" /proc/loadavg 2>/dev/null)
            DISK_LINE=$(df -h / | tail -1)
            DISK_PCT=$(echo "$DISK_LINE" | awk "{print \$5}" | tr -d "%")
            DISK_HUMAN=$(echo "$DISK_LINE" | awk "{print \$3\"/\"\$2\" (\"\$5\")\"}")
            MEM_HUMAN=$(free -h | awk "/Mem:/{print \$3\"/\"\$2}")
            MEM_PCT=$(free | awk "/Mem:/{printf \"%.0f\", \$3/\$2*100}")
            CERT_FILE="/etc/letsencrypt/live/api.picakes.com/fullchain.pem"
            if sudo test -f "$CERT_FILE"; then
              NOT_AFTER=$(sudo openssl x509 -in "$CERT_FILE" -noout -enddate 2>/dev/null | cut -d= -f2)
              EXP_EPOCH=$(date -d "$NOT_AFTER" +%s 2>/dev/null || echo 0)
              SSL_DAYS=$(( (EXP_EPOCH - $(date +%s)) / 86400 ))
            else
              SSL_DAYS="NA"
            fi
            TIMER_ACTIVE=$(systemctl is-active certbot-renew.timer 2>/dev/null)
            TIMER_ENABLED=$(systemctl is-enabled certbot-renew.timer 2>/dev/null)
            NGINX_ACTIVE=$(systemctl is-active nginx 2>/dev/null)
            PM2_JSON=$(pm2 jlist 2>/dev/null)
            PM2_STATUS=$(echo "$PM2_JSON" | jq -r ".[] | select(.name==\"picake-backend-production\") | .pm2_env.status" 2>/dev/null)
            PM2_RESTARTS=$(echo "$PM2_JSON" | jq -r ".[] | select(.name==\"picake-backend-production\") | .pm2_env.restart_time" 2>/dev/null)
            LOCAL_HEALTH=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8080/health 2>/dev/null)
            PG_ACTIVE=$(systemctl is-active postgresql 2>/dev/null)
            PG_CONNECTIONS=$(sudo -u postgres psql -tAc "SELECT count(*) FROM pg_stat_activity;" 2>/dev/null | tr -d "[:space:]")
            PG_STAT_EXT=$(sudo -u postgres psql -d picake_production_db -tAc "SELECT 1 FROM pg_extension WHERE extname='"'"'pg_stat_statements'"'"';" 2>/dev/null | tr -d "[:space:]")
            echo "INSTANCE_TYPE=${INSTANCE_TYPE:-unknown}"
            echo "UPTIME=${UPTIME:-unknown}"
            echo "VCPUS=${VCPUS:-NA}"
            echo "CPU_LOAD1=${CPU_LOAD1:-NA}"
            echo "DISK_PCT=${DISK_PCT:-NA}"
            echo "DISK_HUMAN=${DISK_HUMAN:-NA}"
            echo "MEM_HUMAN=${MEM_HUMAN:-NA}"
            echo "MEM_PCT=${MEM_PCT:-NA}"
            echo "SSL_DAYS=${SSL_DAYS:-NA}"
            echo "TIMER_ACTIVE=${TIMER_ACTIVE:-unknown}"
            echo "TIMER_ENABLED=${TIMER_ENABLED:-unknown}"
            echo "NGINX_ACTIVE=${NGINX_ACTIVE:-unknown}"
            echo "PM2_STATUS=${PM2_STATUS:-unknown}"
            echo "PM2_RESTARTS=${PM2_RESTARTS:-NA}"
            echo "LOCAL_HEALTH=${LOCAL_HEALTH:-000}"
            echo "PG_ACTIVE=${PG_ACTIVE:-unknown}"
            echo "PG_CONNECTIONS=${PG_CONNECTIONS:-NA}"
            echo "PG_STAT_EXT=${PG_STAT_EXT:-0}"
          ' 2>&1) || true
          echo "$OUT"
          echo "$OUT" | grep -E '^[A-Z0-9_]+=' >> "$GITHUB_OUTPUT"

      - name: External checks (SSL + frontend domains)
        id: external
        run: |
          check_ssl() {
            HOST=$1
            EXP=$(echo | openssl s_client -connect "${HOST}:443" -servername "$HOST" 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
            if [ -z "$EXP" ]; then echo "NA"; return; fi
            EPOCH=$(date -d "$EXP" +%s 2>/dev/null || echo 0)
            echo $(( (EPOCH - $(date +%s)) / 86400 ))
          }
          check_http() {
            curl -sf -o /dev/null -w "%{http_code}" --connect-timeout 10 "https://$1" 2>/dev/null || echo 000
          }
          {
            echo "STAGING_API_SSL_DAYS=$(check_ssl api-staging.picakes.com)"
            echo "PROD_API_SSL_DAYS=$(check_ssl api.picakes.com)"
            echo "STAGING_API_HEALTH=$(check_http api-staging.picakes.com/health)"
            echo "PROD_API_HEALTH=$(check_http api.picakes.com/health)"
            echo "STAGING_WEB_USER=$(check_http staging.picakes.com)"
            echo "STAGING_WEB_SELLER=$(check_http seller-staging.picakes.com)"
            echo "STAGING_WEB_ADMIN=$(check_http admin-staging.picakes.com)"
            echo "PROD_WEB_USER=$(check_http picakes.com)"
            echo "PROD_WEB_SELLER=$(check_http seller.picakes.com)"
            echo "PROD_WEB_ADMIN=$(check_http admin.picakes.com)"
          } >> "$GITHUB_OUTPUT"

      - name: Build and send Discord report
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_INFRA_MONITORING }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          S_INSTANCE_TYPE: ${{ steps.staging.outputs.INSTANCE_TYPE }}
          S_UPTIME: ${{ steps.staging.outputs.UPTIME }}
          S_VCPUS: ${{ steps.staging.outputs.VCPUS }}
          S_CPU_LOAD1: ${{ steps.staging.outputs.CPU_LOAD1 }}
          S_DISK_PCT: ${{ steps.staging.outputs.DISK_PCT }}
          S_DISK_HUMAN: ${{ steps.staging.outputs.DISK_HUMAN }}
          S_MEM: ${{ steps.staging.outputs.MEM_HUMAN }}
          S_MEM_PCT: ${{ steps.staging.outputs.MEM_PCT }}
          S_SSL_DAYS: ${{ steps.staging.outputs.SSL_DAYS }}
          S_TIMER_ACTIVE: ${{ steps.staging.outputs.TIMER_ACTIVE }}
          S_TIMER_ENABLED: ${{ steps.staging.outputs.TIMER_ENABLED }}
          S_NGINX: ${{ steps.staging.outputs.NGINX_ACTIVE }}
          S_PM2_STATUS: ${{ steps.staging.outputs.PM2_STATUS }}
          S_PM2_RESTARTS: ${{ steps.staging.outputs.PM2_RESTARTS }}
          S_LOCAL_HEALTH: ${{ steps.staging.outputs.LOCAL_HEALTH }}
          S_PG_ACTIVE: ${{ steps.staging.outputs.PG_ACTIVE }}
          S_PG_CONNECTIONS: ${{ steps.staging.outputs.PG_CONNECTIONS }}
          S_PG_STAT_EXT: ${{ steps.staging.outputs.PG_STAT_EXT }}
          P_INSTANCE_TYPE: ${{ steps.production.outputs.INSTANCE_TYPE }}
          P_UPTIME: ${{ steps.production.outputs.UPTIME }}
          P_VCPUS: ${{ steps.production.outputs.VCPUS }}
          P_CPU_LOAD1: ${{ steps.production.outputs.CPU_LOAD1 }}
          P_DISK_PCT: ${{ steps.production.outputs.DISK_PCT }}
          P_DISK_HUMAN: ${{ steps.production.outputs.DISK_HUMAN }}
          P_MEM: ${{ steps.production.outputs.MEM_HUMAN }}
          P_MEM_PCT: ${{ steps.production.outputs.MEM_PCT }}
          P_SSL_DAYS: ${{ steps.production.outputs.SSL_DAYS }}
          P_TIMER_ACTIVE: ${{ steps.production.outputs.TIMER_ACTIVE }}
          P_TIMER_ENABLED: ${{ steps.production.outputs.TIMER_ENABLED }}
          P_NGINX: ${{ steps.production.outputs.NGINX_ACTIVE }}
          P_PM2_STATUS: ${{ steps.production.outputs.PM2_STATUS }}
          P_PM2_RESTARTS: ${{ steps.production.outputs.PM2_RESTARTS }}
          P_LOCAL_HEALTH: ${{ steps.production.outputs.LOCAL_HEALTH }}
          P_PG_ACTIVE: ${{ steps.production.outputs.PG_ACTIVE }}
          P_PG_CONNECTIONS: ${{ steps.production.outputs.PG_CONNECTIONS }}
          P_PG_STAT_EXT: ${{ steps.production.outputs.PG_STAT_EXT }}
          E_S_API_SSL: ${{ steps.external.outputs.STAGING_API_SSL_DAYS }}
          E_P_API_SSL: ${{ steps.external.outputs.PROD_API_SSL_DAYS }}
          E_S_API_HEALTH: ${{ steps.external.outputs.STAGING_API_HEALTH }}
          E_P_API_HEALTH: ${{ steps.external.outputs.PROD_API_HEALTH }}
          E_S_WEB_USER: ${{ steps.external.outputs.STAGING_WEB_USER }}
          E_S_WEB_SELLER: ${{ steps.external.outputs.STAGING_WEB_SELLER }}
          E_S_WEB_ADMIN: ${{ steps.external.outputs.STAGING_WEB_ADMIN }}
          E_P_WEB_USER: ${{ steps.external.outputs.PROD_WEB_USER }}
          E_P_WEB_SELLER: ${{ steps.external.outputs.PROD_WEB_SELLER }}
          E_P_WEB_ADMIN: ${{ steps.external.outputs.PROD_WEB_ADMIN }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "⚠️ DISCORD_WEBHOOK_URL_INFRA_MONITORING is not set — skipping notification"
            exit 0
          fi

          check_days() {
            local d="$1"
            if [ -z "$d" ] || [ "$d" = "NA" ]; then echo "❓ 확인불가"; return; fi
            if [ "$d" -lt 0 ] 2>/dev/null; then echo "❌ 만료됨 (${d}일 경과)";
            elif [ "$d" -le 14 ] 2>/dev/null; then echo "⚠️ ${d}일 남음";
            else echo "✅ ${d}일 남음"; fi
          }
          check_http_status() {
            local code="$1"
            if [ "$code" = "200" ]; then echo "✅ 200"; else echo "❌ ${code:-000}"; fi
          }
          # --- 인라인 그리드용 짧은 배지 (한 줄, 3열 나열 목적) ---
          badge_pm2() {
            local st="$1"
            if [ "$st" = "online" ]; then echo "✅ online"; else echo "❌ ${st:-unknown}"; fi
          }
          badge_active() {
            local st="$1"
            if [ "$st" = "active" ]; then echo "✅ active"; else echo "❌ ${st:-unknown}"; fi
          }
          # 디스크 80% 이상 = 증설 검토(사내 문서 기준), 90% 이상 = 심각
          badge_disk() {
            local pct="$1"
            if [ -z "$pct" ] || [ "$pct" = "NA" ]; then echo "❓ 확인불가"; return; fi
            if [ "$pct" -ge 90 ] 2>/dev/null; then echo "❌ ${pct}%";
            elif [ "$pct" -ge 80 ] 2>/dev/null; then echo "⚠️ ${pct}%";
            else echo "✅ ${pct}%"; fi
          }
          # 메모리 80~90% 이상 지속 = 주의(사내 문서 기준)
          badge_mem() {
            local pct="$1"
            if [ -z "$pct" ] || [ "$pct" = "NA" ]; then echo "❓ 확인불가"; return; fi
            if [ "$pct" -ge 90 ] 2>/dev/null; then echo "❌ ${pct}%";
            elif [ "$pct" -ge 80 ] 2>/dev/null; then echo "⚠️ ${pct}%";
            else echo "✅ ${pct}%"; fi
          }
          # CPU 80% 이상 = 주의(사내 문서 기준). 하루 1회 스냅샷이라 "지속"은 못 보고 1분 load만 봄 — 참고용.
          badge_cpu() {
            local load1="$1" vcpus="$2"
            if [ -z "$load1" ] || [ -z "$vcpus" ] || [ "$vcpus" = "NA" ]; then echo "❓ 확인불가"; return; fi
            local pct
            pct=$(awk -v l="$load1" -v v="$vcpus" 'BEGIN{printf "%.0f", (l/v)*100}')
            if [ "$pct" -ge 80 ] 2>/dev/null; then echo "⚠️ ${pct}%";
            else echo "✅ ${pct}%"; fi
          }
          badge_pg() {
            local active="$1"
            if [ "$active" = "active" ]; then echo "✅ active"; else echo "❌ ${active:-unknown}"; fi
          }

          S_SSL_F=$(check_days "$S_SSL_DAYS")
          P_SSL_F=$(check_days "$P_SSL_DAYS")
          S_HEALTH_F=$(check_http_status "$S_LOCAL_HEALTH")
          P_HEALTH_F=$(check_http_status "$P_LOCAL_HEALTH")
          S_PM2_F=$(badge_pm2 "$S_PM2_STATUS")
          P_PM2_F=$(badge_pm2 "$P_PM2_STATUS")
          S_NGINX_F=$(badge_active "$S_NGINX")
          P_NGINX_F=$(badge_active "$P_NGINX")
          S_DISK_F=$(badge_disk "$S_DISK_PCT")
          P_DISK_F=$(badge_disk "$P_DISK_PCT")
          S_MEM_F=$(badge_mem "$S_MEM_PCT")
          P_MEM_F=$(badge_mem "$P_MEM_PCT")
          S_CPU_F=$(badge_cpu "$S_CPU_LOAD1" "$S_VCPUS")
          P_CPU_F=$(badge_cpu "$P_CPU_LOAD1" "$P_VCPUS")
          S_PG_F=$(badge_pg "$S_PG_ACTIVE")
          P_PG_F=$(badge_pg "$P_PG_ACTIVE")

          # certbot 타이머 상태 — 상세 블록용 한 줄
          timer_line() {
            local active="$1" enabled="$2"
            if [ "$active" = "active" ] && [ "$enabled" = "enabled" ]; then echo "✅ active/enabled";
            else echo "⚠️ active=${active:-?}, enabled=${enabled:-?}"; fi
          }
          S_TIMER_F=$(timer_line "$S_TIMER_ACTIVE" "$S_TIMER_ENABLED")
          P_TIMER_F=$(timer_line "$P_TIMER_ACTIVE" "$P_TIMER_ENABLED")

          # Postgres 상세 한 줄 (연결 수 · pg_stat_statements 여부)
          pg_detail() {
            local conns="$1" stat_ext="$2"
            local ext_note="pg_stat_statements 미설치"
            if [ "$stat_ext" = "1" ]; then ext_note="pg_stat_statements ✓"; fi
            echo "연결 ${conns:-?}개 · ${ext_note}"
          }
          S_PG_DETAIL=$(pg_detail "$S_PG_CONNECTIONS" "$S_PG_STAT_EXT")
          P_PG_DETAIL=$(pg_detail "$P_PG_CONNECTIONS" "$P_PG_STAT_EXT")

          # CPU 부하율(%) — 업그레이드 가이드 조건 판단에 재사용 (check_cpu는 표시용 문자열만 반환하므로 별도 계산)
          cpu_pct() {
            local load1="$1" vcpus="$2"
            if [ -z "$load1" ] || [ -z "$vcpus" ] || [ "$vcpus" = "NA" ]; then echo 0; return; fi
            awk -v l="$load1" -v v="$vcpus" 'BEGIN{printf "%.0f", (l/v)*100}'
          }
          S_CPU_PCT=$(cpu_pct "$S_CPU_LOAD1" "$S_VCPUS")
          P_CPU_PCT=$(cpu_pct "$P_CPU_LOAD1" "$P_VCPUS")

          # 업그레이드 가이드 (사내 "Backend 업그레이드/모니터링" 문서 기준 5단계 사다리)
          # 디스크→EBS 증설, CPU/메모리→인스턴스 업그레이드(t4g.medium)는 지표로 실제 판단 가능해서 조건부로 뜸.
          # RDS/ALB+ASG/Redis는 사업적 판단(DB 성장 계획, 트래픽 패턴, 쿼리 패턴)이 필요해 지표 하나로 자동 감지 불가 —
          # 고정 안내문으로만 노출(Redis는 pg_stat_statements가 있어야 실제 판단 근거가 생김).
          NL=$'\n'
          UPGRADE_LINES=""
          if [ "$S_DISK_PCT" -ge 80 ] 2>/dev/null; then
            UPGRADE_LINES="${UPGRADE_LINES}⚠️ Staging 디스크 ${S_DISK_PCT}% — EBS 볼륨 증설 검토${NL}"
          fi
          if [ "$P_DISK_PCT" -ge 80 ] 2>/dev/null; then
            UPGRADE_LINES="${UPGRADE_LINES}⚠️ Production 디스크 ${P_DISK_PCT}% — EBS 볼륨 증설 검토${NL}"
          fi
          if { [ "$S_MEM_PCT" -ge 80 ] 2>/dev/null; } || { [ "$S_CPU_PCT" -ge 80 ] 2>/dev/null; }; then
            UPGRADE_LINES="${UPGRADE_LINES}⚠️ Staging CPU/메모리 부하 — t4g.medium 전환 검토 (2단계)${NL}"
          fi
          if { [ "$P_MEM_PCT" -ge 80 ] 2>/dev/null; } || { [ "$P_CPU_PCT" -ge 80 ] 2>/dev/null; }; then
            UPGRADE_LINES="${UPGRADE_LINES}⚠️ Production CPU/메모리 부하 — t4g.medium 전환 검토 (2단계)${NL}"
          fi
          if [ -z "$UPGRADE_LINES" ]; then
            UPGRADE_LINES="✅ 지표 기준 즉시 조치 필요한 항목 없음${NL}"
          fi
          UPGRADE_GUIDE="현재 단계: 1단계 — EC2 단일 인스턴스(t4g.small)${NL}${NL}${UPGRADE_LINES}${NL}다음 단계는 지표만으로 자동 판단 안 됨(사업 판단 필요):${NL}• DB 커짐·자동백업·다중 서버 계획 → 3단계 RDS${NL}• 무중단 배포·트래픽 변동 심함 → 4단계 ALB+ASG${NL}• DB CPU 높음/SELECT 과다/인기데이터 반복조회/응답 느림 → 5단계 Redis"
          if [ "$S_PG_STAT_EXT" != "1" ] && [ "$P_PG_STAT_EXT" != "1" ]; then
            UPGRADE_GUIDE="${UPGRADE_GUIDE}${NL}  (Redis 판단 근거 없음 — pg_stat_statements 미설치, 위 Postgres 항목 참고)"
          fi

          E_S_API_SSL_F=$(check_days "$E_S_API_SSL")
          E_P_API_SSL_F=$(check_days "$E_P_API_SSL")
          E_S_API_HEALTH_F=$(check_http_status "$E_S_API_HEALTH")
          E_P_API_HEALTH_F=$(check_http_status "$E_P_API_HEALTH")
          E_S_WEB_USER_F=$(check_http_status "$E_S_WEB_USER")
          E_S_WEB_SELLER_F=$(check_http_status "$E_S_WEB_SELLER")
          E_S_WEB_ADMIN_F=$(check_http_status "$E_S_WEB_ADMIN")
          E_P_WEB_USER_F=$(check_http_status "$E_P_WEB_USER")
          E_P_WEB_SELLER_F=$(check_http_status "$E_P_WEB_SELLER")
          E_P_WEB_ADMIN_F=$(check_http_status "$E_P_WEB_ADMIN")

          ALL_TEXT="$S_SSL_F $P_SSL_F $S_HEALTH_F $P_HEALTH_F $S_PM2_F $P_PM2_F $S_TIMER_F $P_TIMER_F $S_NGINX_F $P_NGINX_F $S_DISK_F $P_DISK_F $S_MEM_F $P_MEM_F $S_CPU_F $P_CPU_F $S_PG_F $P_PG_F $E_S_API_SSL_F $E_P_API_SSL_F $E_S_API_HEALTH_F $E_P_API_HEALTH_F $E_S_WEB_USER_F $E_S_WEB_SELLER_F $E_S_WEB_ADMIN_F $E_P_WEB_USER_F $E_P_WEB_SELLER_F $E_P_WEB_ADMIN_F"

          BAD_COUNT=$(echo "$ALL_TEXT" | grep -oE '❌|❓' | wc -l | tr -d ' ')
          WARN_COUNT=$(echo "$ALL_TEXT" | grep -oE '⚠️' | wc -l | tr -d ' ')

          if [ "$BAD_COUNT" -gt 0 ] 2>/dev/null; then
            TITLE="🔴  인프라 모니터링 — 확인 필요"
            COLOR=15548997
            SUMMARY="${BAD_COUNT}개 항목이 비정상입니다. 아래를 바로 확인해주세요."
          elif [ "$WARN_COUNT" -gt 0 ] 2>/dev/null; then
            TITLE="🟠  인프라 모니터링 — 주의"
            COLOR=16776960
            SUMMARY="${WARN_COUNT}개 항목이 임계치에 근접했습니다."
          else
            TITLE="🟢  인프라 모니터링 — 정상"
            COLOR=5763719
            SUMMARY="모든 항목이 정상입니다."
          fi
          DESCRIPTION="**${SUMMARY}**${NL}[📄 워크플로우 로그 보기](${RUN_URL})"

          E_S_WEB="user ${E_S_WEB_USER_F} · seller ${E_S_WEB_SELLER_F} · admin ${E_S_WEB_ADMIN_F}"
          E_P_WEB="user ${E_P_WEB_USER_F} · seller ${E_P_WEB_SELLER_F} · admin ${E_P_WEB_ADMIN_F}"

          # 각 환경 상세 한 줄 (인라인 배지 3열 아래에 붙는 보조 정보)
          S_DETAIL="가동시간 ${S_UPTIME:-unknown} · 메모리 ${S_MEM:-NA} · 디스크 ${S_DISK_HUMAN:-NA} · pm2 재시작 ${S_PM2_RESTARTS:-NA}회 · Postgres ${S_PG_DETAIL}"
          P_DETAIL="가동시간 ${P_UPTIME:-unknown} · 메모리 ${P_MEM:-NA} · 디스크 ${P_DISK_HUMAN:-NA} · pm2 재시작 ${P_PM2_RESTARTS:-NA}회 · Postgres ${P_PG_DETAIL}"

          S_SSL_BLOCK="EC2 로컬 SSL ${S_SSL_F} · certbot ${S_TIMER_F}${NL}외부 SSL(api-staging) ${E_S_API_SSL_F} · 외부 헬스체크 ${E_S_API_HEALTH_F} · localhost 헬스체크 ${S_HEALTH_F}"
          P_SSL_BLOCK="EC2 로컬 SSL ${P_SSL_F} · certbot ${P_TIMER_F}${NL}외부 SSL(api) ${E_P_API_SSL_F} · 외부 헬스체크 ${E_P_API_HEALTH_F} · localhost 헬스체크 ${P_HEALTH_F}"

          # AWS 사용 현황 — 실시간 API 조회가 아니라 현재 알려진 구성을 고정 텍스트로 안내(자주 안 바뀌는 정보).
          # 구성이 바뀌면(리전 이전, 서비스 추가 등) 이 문자열도 같이 고쳐야 함.
          AWS_USAGE="\`EC2\`(${S_INSTANCE_TYPE:-unknown}) staging/production 각 1대 · \`Route53\`(picakes.com) · \`CloudFront\`+\`S3\`(정적 리소스) · \`Let's Encrypt\`(SSL, EC2 자체 갱신)${NL}-# Cost Explorer/CloudWatch 연동 없음 · 이 리포트는 SSH 기반이라 인스턴스 자체가 죽으면 값이 안 나옴"

          DIVIDER="▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --argjson color "$COLOR" \
            --arg description "$DESCRIPTION" \
            --arg divider "$DIVIDER" \
            --arg s_type "${S_INSTANCE_TYPE:-unknown}" \
            --arg s_cpu "$S_CPU_F" --arg s_disk "$S_DISK_F" --arg s_mem "$S_MEM_F" \
            --arg s_pg "$S_PG_F" --arg s_pm2 "$S_PM2_F" --arg s_nginx "$S_NGINX_F" \
            --arg s_detail "$S_DETAIL" --arg s_ssl_block "$S_SSL_BLOCK" --arg s_web "$E_S_WEB" \
            --arg p_type "${P_INSTANCE_TYPE:-unknown}" \
            --arg p_cpu "$P_CPU_F" --arg p_disk "$P_DISK_F" --arg p_mem "$P_MEM_F" \
            --arg p_pg "$P_PG_F" --arg p_pm2 "$P_PM2_F" --arg p_nginx "$P_NGINX_F" \
            --arg p_detail "$P_DETAIL" --arg p_ssl_block "$P_SSL_BLOCK" --arg p_web "$E_P_WEB" \
            --arg upgrade_guide "$UPGRADE_GUIDE" \
            --arg aws_usage "$AWS_USAGE" \
            '{
              embeds: [{
                title: $title,
                description: $description,
                color: $color,
                fields: [
                  { name: "🟡 STAGING · \($s_type)", value: "`api-staging.picakes.com`", inline: false },
                  { name: "CPU", value: $s_cpu, inline: true },
                  { name: "메모리", value: $s_mem, inline: true },
                  { name: "디스크", value: $s_disk, inline: true },
                  { name: "Postgres", value: $s_pg, inline: true },
                  { name: "PM2", value: $s_pm2, inline: true },
                  { name: "nginx", value: $s_nginx, inline: true },
                  { name: "상세", value: $s_detail, inline: false },
                  { name: "SSL · 헬스체크", value: $s_ssl_block, inline: false },
                  { name: "프론트엔드", value: $s_web, inline: false },

                  { name: "​", value: $divider, inline: false },

                  { name: "🔴 PRODUCTION · \($p_type)", value: "`api.picakes.com`", inline: false },
                  { name: "CPU", value: $p_cpu, inline: true },
                  { name: "메모리", value: $p_mem, inline: true },
                  { name: "디스크", value: $p_disk, inline: true },
                  { name: "Postgres", value: $p_pg, inline: true },
                  { name: "PM2", value: $p_pm2, inline: true },
                  { name: "nginx", value: $p_nginx, inline: true },
                  { name: "상세", value: $p_detail, inline: false },
                  { name: "SSL · 헬스체크", value: $p_ssl_block, inline: false },
                  { name: "프론트엔드", value: $p_web, inline: false },

                  { name: "​", value: $divider, inline: false },

                  { name: "📈 업그레이드 가이드", value: $upgrade_guide, inline: false },
                  { name: "☁️ AWS 사용 현황", value: $aws_usage, inline: false }
                ],
                footer: { text: "Picake Infra Monitor · 매일 09:00 KST" },
                timestamp: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
              }]
            }')

          HTTP_STATUS=$(curl -s -o /tmp/discord_response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Discord notification sent (HTTP $HTTP_STATUS)"
          else
            echo "⚠️ Discord notification failed (HTTP $HTTP_STATUS)"
            cat /tmp/discord_response.txt
            exit 1
          fi
