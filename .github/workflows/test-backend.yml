name: Test Backend

# staging/main으로 향하는 PR에서 실행 (머지 전 게이트).
# 이 워크플로우 자체는 브랜치 보호 규칙과 함께 설정해야 실제로 머지를 막을 수 있습니다.
#
# ⚠️ 트리거에 `paths:` 필터를 넣지 마세요.
# 이 job은 브랜치 보호의 **필수 체크**로 지정돼 있습니다. 필수 체크는 해당 이름의 체크가
# 성공을 보고할 때까지 기다리는데, `paths:`로 걸러지면 워크플로우가 아예 뜨지 않아 아무것도
# 보고되지 않습니다. 그러면 PR은 `Expected — Waiting for status to be reported` 상태로
# 영구히 머지 불가가 됩니다(웹 전용 PR에서 실제로 발생 — #165).
# 그래서 트리거는 항상 걸고, 백엔드 변경 여부는 아래 `Check backend changes`에서 판단해
# 각 단계를 건너뜁니다. CI 시간을 아끼려는 원래 의도는 그대로 유지되면서(백엔드 변경이 없으면
# 체크아웃+판단만 하고 종료), 체크는 정상적으로 성공을 보고합니다.
on:
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest

    # DB 통합테스트(yarn test:integration)가 실제로 붙는 Postgres.
    # backend 변경이 없는 PR에서는 이 컨테이너도 그냥 띄워지기만 하고 안 쓰입니다(비용 미미).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: picake_backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # fetch-depth: 0 — 기본 체크아웃은 shallow라 base 브랜치와 diff를 뜰 수 없음
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 트리거 `paths:`를 대체하는 판단 단계 (위 주석 참고).
      # 워크플로우 자신을 포함하는 것도 기존 `paths:`와 동일 — 이 파일을 고칠 때는 테스트가 실제로 돌아야 함.
      - name: Check backend changes
        id: changes
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^apps/backend/|^\.github/workflows/test-backend\.yml$'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::백엔드 변경 없음 — 테스트를 건너뜁니다"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # packageManager: yarn@4.x — setup-node의 cache: yarn은 Corepack 전 Yarn 1.x를 호출해 실패함
      - name: Enable Corepack
        if: steps.changes.outputs.backend == 'true'
        run: corepack enable

      - name: Get Yarn cache directory
        if: steps.changes.outputs.backend == 'true'
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn dependencies
        if: steps.changes.outputs.backend == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        if: steps.changes.outputs.backend == 'true'
        run: yarn install --immutable

      - name: Run backend unit tests
        if: steps.changes.outputs.backend == 'true'
        run: yarn workspace @picake/backend test

      # .env.test는 .gitignore 대상(.env.*)이라 로컬처럼 CI에서도 실행 직전에 만들어줌.
      # 위 services.postgres 컨테이너를 가리키도록 구성.
      #
      # DB 통합테스트는 DATABASE_URL만 있으면 되지만, E2E 테스트는 AppModule을 통째로
      # 띄우기 때문에 생성자에서 값이 없으면 즉시 throw(또는 크래시)하는 provider들
      # (JwtStrategy, UploadCreateService, KftcApiService/NtsApiService,
      # TokenEncryptionUtil, AuthAppleOauthService)에 값을 채워줘야 부팅이 된다.
      # 실제로 그 값으로 외부 API를 호출하는 경로는 테스트에서 안 타므로 가짜 값으로 충분하다.
      # (GOOGLE/KAKAO/FIREBASE 등 나머지는 미설정 시 생성자에서 조용히 비활성화되는
      # 방식으로 코드가 짜여 있어 값이 없어도 부팅에 지장 없음 — 로컬에서 값을 하나씩
      # 빼보며 실제로 검증했다)
      - name: Create .env.test for DB integration / E2E tests
        if: steps.changes.outputs.backend == 'true'
        working-directory: apps/backend
        run: |
          cat > .env.test <<EOF
          NODE_ENV=test
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/picake_backend_test?schema=public"
          JWT_SECRET=ci-test-jwt-secret-do-not-use-in-real-env
          DATA_GO_KR_API_KEY=ci-test-fake-key
          AWS_REGION=ap-northeast-2
          AWS_ACCESS_KEY_ID=ci-test-fake-access-key-id
          AWS_SECRET_ACCESS_KEY=ci-test-fake-secret-access-key
          S3_BUCKET=ci-test-fake-bucket
          APPLE_TEAM_ID=ci-test-team-id
          APPLE_KEY_ID=ci-test-key-id
          APPLE_PRIVATE_KEY=ci-test-fake-private-key
          APPLE_CLIENT_ID=ci-test-client-id
          APPLE_REFRESH_TOKEN_ENCRYPTION_KEY=$(openssl rand -hex 32)
          EOF

      # test:integration 스크립트 자체가 db:migrate:test를 먼저 실행함
      - name: Run backend DB integration tests
        if: steps.changes.outputs.backend == 'true'
        run: yarn workspace @picake/backend test:integration

      - name: Run backend API E2E tests
        if: steps.changes.outputs.backend == 'true'
        run: yarn workspace @picake/backend test:e2e
